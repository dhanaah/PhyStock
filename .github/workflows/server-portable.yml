name: Build Server (portable)

# Builds the AIS PhyStock Server PORTABLE folder on a Windows runner:
# official python.org runtime + all pip packages (incl. OCR models) + server
# files. No custom EXE (nothing for Apex One to quarantine), nothing to
# install on the data-center PC, no internet needed there.
#
#  • "Run workflow" button        → portable folder as a workflow artifact
#  • push to main touching server → same, automatically

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server-portable.yml']
  workflow_dispatch:

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read server version
        id: ver
        shell: bash
        run: echo "version=$(grep -oP 'SERVER_VERSION = \"\K[0-9.]+' server/server.py)" >> "$GITHUB_OUTPUT"

      - name: Build portable folder
        shell: pwsh
        working-directory: server
        run: |
          $ErrorActionPreference = 'Stop'
          $PYVER = '3.12.8'
          $OUT = 'portable/AISPhyStockServer'
          $PYDIR = "$OUT/python"
          New-Item -ItemType Directory -Force $PYDIR | Out-Null
          "[1/5] Downloading Python $PYVER embeddable runtime"
          Invoke-WebRequest "https://www.python.org/ftp/python/$PYVER/python-$PYVER-embed-amd64.zip" -OutFile python-embed.zip
          Expand-Archive -Force python-embed.zip $PYDIR
          Remove-Item python-embed.zip
          "[2/5] Enabling site-packages"
          # embeddable Python ignores the script folder: put the server folder (..) on sys.path and enable site-packages
          Get-ChildItem "$PYDIR/python*._pth" | ForEach-Object { ((Get-Content $_) -replace '^#\s*import site','import site') + '..' | Set-Content $_ }
          Get-Content "$PYDIR/python312._pth"
          "[3/5] Installing pip"
          Invoke-WebRequest https://bootstrap.pypa.io/get-pip.py -OutFile get-pip.py
          & "$PYDIR/python.exe" get-pip.py --no-warn-script-location -q
          if ($LASTEXITCODE) { throw "get-pip failed" }
          Remove-Item get-pip.py
          "[4/5] Installing server packages"
          & "$PYDIR/python.exe" -m pip install --no-warn-script-location -r requirements.txt -r requirements-ocr.txt
          if ($LASTEXITCODE) { throw "pip install failed" }
          "[5/5] Copying server files"
          Copy-Item server.py,db.py,countsheet.py,tray.png,icon.ico,README.md $OUT
          Copy-Item -Recurse -Force static "$OUT/static"
          Set-Content "$OUT/AIS PhyStock Server.bat" -Value @'
          @echo off
          cd /d "%~dp0"
          start "" "%~dp0python\pythonw.exe" server.py
          '@
          Set-Content "$OUT/AIS PhyStock Server (console).bat" -Value @'
          @echo off
          cd /d "%~dp0"
          "%~dp0python\python.exe" server.py --no-tray
          pause
          '@
          "Done. Size: {0:N0} MB" -f ((Get-ChildItem -Recurse $OUT | Measure-Object Length -Sum).Sum / 1MB)

      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: AISPhyStock-Server-portable-v${{ steps.ver.outputs.version }}
          path: server/portable/AISPhyStockServer
          retention-days: 90

      - name: Smoke test (starts, answers /ping, stops)
        shell: pwsh
        working-directory: server/portable/AISPhyStockServer
        run: |
          $p = Start-Process -FilePath "python\python.exe" -ArgumentList "server.py","--no-tray","--port","8799" -PassThru -NoNewWindow -RedirectStandardOutput out.log -RedirectStandardError err.log
          $ok = $false
          foreach ($i in 1..45) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { break }
            try { $r = Invoke-RestMethod http://127.0.0.1:8799/api/v1/ping -TimeoutSec 3; "ping ok after $($i*2)s: server $($r.serverVersion)"; $ok = $true; break } catch {}
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          "--- out.log ---"; Get-Content out.log -ErrorAction SilentlyContinue | Select-Object -Last 40
          "--- err.log ---"; Get-Content err.log -ErrorAction SilentlyContinue | Select-Object -Last 40
          "--- data/server.log ---"; Get-Content data/server.log -ErrorAction SilentlyContinue | Select-Object -Last 40
          $log = ((Get-Content err.log -ErrorAction SilentlyContinue | Select-Object -Last 25) -join "`n")
          "## Smoke test $(if($ok){'PASSED'}else{'FAILED'})`n``````text`n$log`n``````" >> $env:GITHUB_STEP_SUMMARY
          if (-not $ok) { exit 1 }
