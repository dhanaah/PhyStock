name: Build Android APK

# Builds the AIS PhyStock APK with EAS *local* build on the GitHub runner
# (no EAS cloud quota used; signed with the project's EAS keystore so it
# installs over existing devices). Needs one repository secret:
#   EXPO_TOKEN  — a robot/personal access token from expo.dev → Account settings → Access tokens
#
#  • every push to main          → APK attached as a workflow artifact
#  • push of a tag like v1.4.1   → APK also published on a GitHub Release (stable download link)
#  • "Run workflow" button       → manual build any time

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['server/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: Build APK (EAS local)
        env:
          EAS_NO_VCS: 1
          EAS_LOCAL_BUILD_SKIP_CLEANUP: 0
        run: eas build --platform android --profile preview --local --non-interactive --output ./AISPhyStock-v${{ steps.ver.outputs.version }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AISPhyStock-v${{ steps.ver.outputs.version }}
          path: ./AISPhyStock-v${{ steps.ver.outputs.version }}.apk
          retention-days: 90

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AIS PhyStock ${{ github.ref_name }}
          files: ./AISPhyStock-v${{ steps.ver.outputs.version }}.apk
          generate_release_notes: true
